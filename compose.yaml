# webgate compose stack.
#
# Default: webgate + bundled SearXNG + one CloakBrowser (cloakserve CDP).
# Google stays inside SearXNG (!g). There is no webgate provider "google".
# Only webgate publishes a caller-facing port. SearXNG and CDP stay on the
# compose network.
#
# CDP_ENDPOINT defaults to the bundled cloakserve HTTP root
# (http://cloak:9222). Override it to point at any other already-running
# CDP (http://host:port, /json/version, or ws://…). No Manager, no profiles.

services:
  webgate:
    build: .
    ports:
      - "8787:8787"
    environment:
      WEBGATE_ADDR: ":8787"
      WEBGATE_TOKEN: ${WEBGATE_TOKEN:?set WEBGATE_TOKEN in .env}
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-http://searxng:8080}
      CDP_ENDPOINT: ${CDP_ENDPOINT:-http://cloak:9222}
      CDP_API_KEY: ${CDP_API_KEY:-}
      WEBGATE_CLOAK_DISABLED: ${WEBGATE_CLOAK_DISABLED:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      XAI_BASE_URL: ${XAI_BASE_URL:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      XAI_MODEL: ${XAI_MODEL:-}
    depends_on:
      searxng:
        condition: service_started
      cloak:
        condition: service_healthy
    restart: unless-stopped

  searxng:
    build: ./deploy/searxng
    expose:
      - "8080"
    environment:
      CDP_ENDPOINT: ${CDP_ENDPOINT:-http://cloak:9222}
      CDP_API_KEY: ${CDP_API_KEY:-}
      SEARXNG_BASE_URL: ${SEARXNG_PUBLIC_BASE_URL:-http://searxng:8080/}
      MIN_INTERVAL_MS: ${MIN_INTERVAL_MS:-}
      MAX_PAGE: ${MAX_PAGE:-}
      GOTO_TIMEOUT_MS: ${GOTO_TIMEOUT_MS:-}
      WAIT_SELECTOR_TIMEOUT_MS: ${WAIT_SELECTOR_TIMEOUT_MS:-}
      CAPTCHA_RETRIES: ${CAPTCHA_RETRIES:-}
      FAILURE_CACHE_S: ${FAILURE_CACHE_S:-}
      GOOGLE_HL: ${GOOGLE_HL:-}
      GOOGLE_GL: ${GOOGLE_GL:-}
      GOOGLE_UDM: ${GOOGLE_UDM:-}
      GOOGLE_SAFE: ${GOOGLE_SAFE:-}
      GOOGLE_PWS: ${GOOGLE_PWS:-}
      GOOGLE_AS_EQ: ${GOOGLE_AS_EQ:-}
    volumes:
      - ./deploy/searxng/config:/etc/searxng
      - ./deploy/searxng/data:/var/cache/searxng
    depends_on:
      cloak:
        condition: service_healthy
    restart: unless-stopped

  cloak:
    image: cloakhq/cloakbrowser:latest
    command: cloakserve
    expose:
      - "9222"
    # CDP is unauthenticated. Do not publish 9222 to the host/LAN.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9222/json/version"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    shm_size: "2gb"
    restart: unless-stopped
